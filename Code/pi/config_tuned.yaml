# config_tuned.yaml
# =================
# Tuned parameters for the framing (vision) channel.
# Fitted jointly on TWO clips by tuning/sweep.py, 2026-08-16.
#
#   python run_clip.py --config config_tuned.yaml --resize 640x480
#
# READ THE BIG CAVEAT FIRST
# -------------------------
# Most of the improvement in this project's arrows did NOT come from these
# parameters. It came from a bug fix in guidance_mapper._decompose_homography
# (reading the homography's last column instead of mapping the image centre).
# With that fix and NO parameter changes at all, wrong-way arrows already fell
# from 19.7% -> 0.4% (convergence clip) and 27.2% -> 3.1% (tour clip).
#
# These values add the rest: they take confident-but-wrong to zero, raise
# coverage, and eliminate state thrashing. But if you only adopt one thing from
# this work, adopt the guidance_mapper fix, not this file.
#
# Fitted on:
#   Data/VIDEO_PRUEBA_IP_riberas.mp4 (convergence, ref = IMAGEN_REF_IP_riberas
#     with its letterbox bars cropped, arrives on target ~frame 1247)
#   Data/VIDEO_PRUEBA_IP.mp4 (tour, ref = frame 32)
# Selected by maximising the WORSE of the two clips' scores, not the average,
# and subject to missing the lock on at most 20% of genuinely on-target frames.
# Optimising the average would have let one clip carry a config that fails on
# the other -- which is exactly what happened on the first attempt.
#
# Measured, defaults -> this file (both with the decomposition fix):
#                        riberas          tour
#   composite score      56.40 -> 86.03   75.42 -> 81.38
#   confident-but-wrong   0.4% ->  0.0%    4.9% ->  0.0%
#   coverage             72.9% -> 98.8%   95.3% -> 91.6%
#   missed lock on target 0.0% ->  0.0%    3.7% ->  0.0%
#   SEARCH<->MICRO thrash 10.9 ->  0.00    2.68 ->  0.00   (per 100 frames)
#
# COST: essentially free. Nothing here changes the resolution, ROI or crop size
# that the search and micrometry stages work on, so the CM4 timing you already
# measured still stands. Re-confirm in Phase 4 anyway.

# ---------------------------------------------------------------------------
# Matching + geometry  (Tier A -- both clips agreed on these, independently)
# ---------------------------------------------------------------------------

# 0.85 was unusually permissive; 0.70-0.75 is the classical Lowe default.
# Both clips preferred 0.70-0.75 by a clear margin.
lowe_ratio: 0.75

# The strongest single agreement between the clips. At 5.0 px MAGSAC called
# almost anything an inlier, which is how geometrically absurd homographies
# came back with inlier ratios of 0.9+.
magsac_reproj_px: 1.5

# ---------------------------------------------------------------------------
# State machine gates  (Tier B -- replayed offline, free to search)
# ---------------------------------------------------------------------------

# 0.35 accepted almost every homography the estimator produced.
inlier_ratio_threshold: 0.9

# Can be LOWER than the old 15 now, because inlier_ratio_threshold is doing the
# real filtering and min_inliers no longer doubles as an estimator-internal
# reject (that job moved to min_matches_for_homography in the refactor).
min_inliers: 10

# Lowered, not raised. On the convergence clip this was the single biggest
# Tier-B lever and it wanted to go DOWN: phase correlation is accurate far
# below PSR 10 (median direction error 0.2-1.2 deg across the whole probe
# range), so a threshold of 10.0 was discarding good sub-pixel readings and
# forcing needless drop-backs to SEARCH.
phase_psr_threshold: 4.0

# RAISED 8.0 -> 15.0 on 2026-08-31. The 8.0 came from a sweep over RECORDED
# CLIPS, where nobody is standing behind the camera reacting to the arrow, so
# the sweep could never see the thing that actually breaks the lock: the
# operator's own tremor inside a feedback loop. Measured, that tremor is 5.0 px
# at the full-FOV mode, so 8.0 is 1.6 sigma and the lock cannot stay lit by
# hand. 15 px is 3 sigma, matching the rule already used for
# lock_deg_threshold. Full reasoning in config.py.
lock_px_threshold: 15.0

# ---------------------------------------------------------------------------
# Deliberately left at defaults -- and why that matters
# ---------------------------------------------------------------------------
# search_roi_fraction (0.6) and search_scale (0.5)
#     An earlier single-clip sweep made these look like the two biggest levers
#     in the whole system (score spreads of 31 and 26). On the second clip they
#     REVERSED: 0.9 and 1.0 were worse than the defaults. They were compensating
#     for the decomposition bug -- a wider ROI produced homographies with less
#     spurious rotation, which shrank the corner-vs-centre error. With the bug
#     fixed there is no reason to pay their cost. This is the clearest example
#     in this project of why a single clip cannot be trusted.
#
# phase_crop_size (256)
#     384 looked strongly better on the convergence clip (+15) and did nothing
#     on the tour clip, at 2.25x the micrometry cost. Not worth it on this
#     evidence; revisit if a third clip agrees.
#
# search_n_features (500), orb_n_features (1000), phase_psr_exclusion (11),
# deadband_px (3.0)
#     Measured spread under 0.6 points on BOTH clips. These do not matter.
#     Stop tuning them.
#
# max_translation_px / max_scale_deviation / max_perspective (all None)
#     The homography plausibility gate never helped on either clip once
#     inlier_ratio_threshold was raised -- the two mechanisms reject the same
#     bad homographies. The code stays (config-gated, off). Note it currently
#     tests H[0,2]/H[1,2], which has the same corner-vs-centre issue as the
#     decomposition did; fix that before re-testing it.
